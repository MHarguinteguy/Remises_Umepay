<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Traslados Umepay</title>

  <style>
    :root {
      --fondo: #f4f0df;
      --panel: #f8f3e7;
      --tarjeta: #e5e8db;
      --verde: #183d32;
      --texto: #171714;
      --texto-suave: #625f54;
      --linea: #bdb6a2;
      --boton: #171717;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: var(--fondo);
    }

    .pagina {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid rgba(24, 61, 50, 0.18);
      border-radius: 28px;
      box-shadow: 0 16px 45px rgba(47, 53, 42, 0.14);
    }

    .encabezado {
      padding: 18px 18px 0;
    }

    .imagen-principal {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 21px;
    }

    .separador {
      height: 1px;
      margin: 24px 22px 0;
      background: var(--linea);
    }

    .contactos {
      padding: 27px 20px 12px;
    }

    .pregunta {
      margin: 0 0 24px;
      text-align: center;
      color: var(--verde);
      font-size: 23px;
      line-height: 1.3;
    }

    .contacto {
      margin-bottom: 18px;
      padding: 20px 17px 17px;
      background: var(--tarjeta);
      border-radius: 22px;
    }

    .nombre {
      margin: 0 0 14px 3px;
      font-size: 24px;
    }

    .boton-whatsapp {
      width: 100%;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 15px 18px;
      color: var(--blanco);
      background: var(--boton);
      border-radius: 999px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .boton-whatsapp:hover {
      background: var(--verde);
      transform: translateY(-2px);
    }

    .boton-whatsapp:active {
      transform: scale(0.98);
    }

    .icono-whatsapp {
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
    }

    footer {
      padding: 6px 20px 25px;
      text-align: center;
      color: var(--texto-suave);
      font-size: 16px;
      line-height: 1.4;
    }

    @media (max-width: 380px) {
      body {
        padding: 9px;
      }

      .pagina {
        border-radius: 22px;
      }

      .encabezado {
        padding: 11px 11px 0;
      }

      .contactos {
        padding-right: 15px;
        padding-left: 15px;
      }

      .pregunta {
        font-size: 21px;
      }

      .boton-whatsapp {
        font-size: 16px;
      }
    }
  </style>
</head>
