<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Contactos de WhatsApp de Remises Umepay"
  >

  <title>Remises Umepay</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        linear-gradient(
          145deg,
          #12232e 0%,
          #1f4b5a 55%,
          #2c6975 100%
        );
    }

    .tarjeta {
      width: 100%;
      max-width: 430px;
      padding: 38px 26px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.97);
      color: #18333d;
      border-radius: 24px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    .icono {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #25d366;
      color: #ffffff;
      font-size: 36px;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      color: #163640;
    }

    .subtitulo {
      margin: 12px 0 28px;
      color: #607780;
      font-size: 16px;
      line-height: 1.5;
    }

    .boton {
      width: 100%;
      margin: 14px 0;
      padding: 17px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: #25d366;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 15px rgba(37, 211, 102, 0.22);
      transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .boton:hover {
      background: #1fbd59;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
    }

    .boton:active {
      transform: translateY(0);
    }

    .boton:focus-visible {
      outline: 3px solid #163640;
      outline-offset: 3px;
    }

    .whatsapp {
      font-size: 22px;
    }

    .aclaracion {
      margin: 26px 0 0;
      padding-top: 20px;
      border-top: 1px solid #dfe7e9;
      color: #71868d;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .tarjeta {
        padding: 32px 20px 26px;
      }

      h1 {
        font-size: 27px;
      }

      .boton {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="tarjeta">
    <div class="icono" aria-hidden="true">
      🚕
    </div>

    <h1>Remises Umepay</h1>

    <p class="subtitulo">
      Seleccioná un contacto para comunicarte directamente por WhatsApp.
    </p>

    <a
      class="boton"
      href="https://wa.me/5493853051669"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar a Amortina por WhatsApp"
    >
      <span class="whatsapp" aria-hidden="true">◉</span>
      Contactar a Amortina
    </a>

    <a
      class="boton"
      href="https://wa.me/5491141904822"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar a Celeste por WhatsApp"
    >
      <span class="whatsapp" aria-hidden="true">◉</span>
      Contactar a Celeste
    </a>

    <a
      class="boton"
      href="https://wa.me/5491150446724"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar a Maga por WhatsApp"
    >
      <span class="whatsapp" aria-hidden="true">◉</span>
      Contactar a Maga
    </a>

    <p class="aclaracion">
      Al seleccionar un contacto se abrirá WhatsApp en el dispositivo.
    </p>
  </main>
</body>
</html>
